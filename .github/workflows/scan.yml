name: Scan crypto offers

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours. For every 4 hours use "0 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py
      - name: Save seen links
        run: |
          git config user.name "offers-bot"
          git config user.email "offers-bot@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || (git commit -m "update seen links" && git push)
